{% extends 'flatpages/sample.html' %}
{% load cache %}

{%block title%}
    Categories
{%endblock title%}

{%block body%}
    <h2>Категории:</h2>
    <hr>

    {% cache 1800 categories_list %}

    {% if categories %}
        {% for category in categories %}
            <h3><a href="{% url 'category_detail' category.id %}">{{ category.name }}</a></h3>
        {% endfor %}
    {% endif %}
    {% endcache %}
{%endblock body%}
